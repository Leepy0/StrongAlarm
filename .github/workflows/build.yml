name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 커밋 수로 버전 번호 계산

      # 버전 번호: 폰 = 전체 커밋 수, 워치 = 워치에 들어가는 코드(wear·core)를 바꾼 커밋 수
      - name: Version
        run: |
          echo "APP_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "WATCH_VERSION_CODE=$(git rev-list --count HEAD -- wear core gradle/libs.versions.toml)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:assembleDebug :wear:assembleDebug 2>&1 | tee build.log

      # 폰·워치 APK + version.json을 'latest' 릴리스에 게시 (매 빌드마다 교체)
      # version.json: 앱이 자동 업데이트 확인에 사용 (버전, APK sha256, 최근 변경 내역)
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StrongAlarm-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk StrongAlarm-watch.apk
          notes="[]"
          for c in $(git log -15 --format=%H -- . ':(exclude)*.md' ':(exclude)docs'); do
            notes=$(jq -c --argjson v "$(git rev-list --count "$c")" --arg s "$(git log -1 --format=%s "$c")" \
              '. + [{v: $v, s: $s}]' <<< "$notes")
          done
          jq -n \
            --argjson versionCode "$APP_VERSION_CODE" \
            --arg versionName "0.2.$APP_VERSION_CODE" \
            --arg sha "$GITHUB_SHA" \
            --arg phoneSha256 "$(sha256sum StrongAlarm-phone.apk | cut -d' ' -f1)" \
            --argjson phoneSize "$(stat -c%s StrongAlarm-phone.apk)" \
            --argjson watchVersionCode "$WATCH_VERSION_CODE" \
            --arg watchSha256 "$(sha256sum StrongAlarm-watch.apk | cut -d' ' -f1)" \
            --argjson notes "$notes" \
            '{versionCode: $versionCode, versionName: $versionName, sha: $sha, phoneSha256: $phoneSha256,
              phoneSize: $phoneSize, watchVersionCode: $watchVersionCode, watchSha256: $watchSha256, notes: $notes}' > version.json
          cat version.json
          title="0.2.$APP_VERSION_CODE (${GITHUB_SHA::7})"
          notes="폰 0.2.$APP_VERSION_CODE: StrongAlarm-phone.apk / 워치 0.2.$WATCH_VERSION_CODE: StrongAlarm-watch.apk"
          # 릴리스를 지웠다 다시 만들면 그 사이 404가 나고, 중간 취소 시 릴리스가 사라짐 → 자산만 교체.
          # APK를 먼저 올리고 version.json을 마지막에 올려 앱이 새 버전을 보는 시점엔 APK가 이미 새 것
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest StrongAlarm-phone.apk StrongAlarm-watch.apk --clobber
            gh release upload latest version.json --clobber
            gh release edit latest --title "$title" --notes "$notes" --prerelease
          else
            gh release create latest StrongAlarm-phone.apk StrongAlarm-watch.apk version.json \
              --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
          fi

      # 화면 스크린샷 (Robolectric) — 실패해도 APK 게시에는 영향 없음
      - name: Screenshots
        id: shots
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .ci-fonts
          curl -sSL -o .ci-fonts/NotoSansKR.ttf "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" || true
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee shots.log

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots --yes --cleanup-tag || true
          files=$(ls app/build/screenshots/*.png 2>/dev/null || true)
          if [ -n "$files" ]; then
            gh release create screenshots $files --target "$GITHUB_SHA" --prerelease \
              --title "화면 스크린샷 (${GITHUB_SHA::7})" --notes "Robolectric 렌더링"
          fi

      # 성공·실패와 관계없이 빌드 로그 보관
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "build.log 없음" > build.log
          [ -f shots.log ] || echo "shots.log 없음" > shots.log
          gh release view ci-log >/dev/null 2>&1 || \
            gh release create ci-log --prerelease --title "CI 로그" --notes "마지막 빌드 로그"
          gh release upload ci-log build.log shots.log --clobber
