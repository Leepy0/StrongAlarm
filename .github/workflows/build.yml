name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:assembleDebug :wear:assembleDebug 2>&1 | tee build.log

      # 폰·워치 APK를 'latest' 릴리스에 게시 (매 빌드마다 교체)
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StrongAlarm-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk StrongAlarm-watch.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StrongAlarm-phone.apk StrongAlarm-watch.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "최신 빌드 (${GITHUB_SHA::7})" \
            --notes "main ${GITHUB_SHA::7} debug 빌드. 폰: StrongAlarm-phone.apk / 워치: StrongAlarm-watch.apk"

      # 화면 스크린샷 (Robolectric) — 실패해도 APK 게시에는 영향 없음
      - name: Screenshots
        id: shots
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .ci-fonts
          curl -sSL -o .ci-fonts/NotoSansKR.ttf "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" || true
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee shots.log

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots --yes --cleanup-tag || true
          files=$(ls app/build/screenshots/*.png 2>/dev/null || true)
          if [ -n "$files" ]; then
            gh release create screenshots $files --target "$GITHUB_SHA" --prerelease \
              --title "화면 스크린샷 (${GITHUB_SHA::7})" --notes "Robolectric 렌더링"
          fi

      # 성공·실패와 관계없이 빌드 로그 보관
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "build.log 없음" > build.log
          [ -f shots.log ] || echo "shots.log 없음" > shots.log
          gh release view ci-log >/dev/null 2>&1 || \
            gh release create ci-log --prerelease --title "CI 로그" --notes "마지막 빌드 로그"
          gh release upload ci-log build.log shots.log --clobber
